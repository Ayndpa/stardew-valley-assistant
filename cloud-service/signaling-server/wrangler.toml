name = "ice-signaling"
main = "src/index.ts"

# 自有域名（workers.dev 在国内被阻断）：wrangler 部署时自动创建 DNS 记录与证书
routes = [{ pattern = "stardew-ice.unmod.online", custom_domain = true }]
compatibility_date = "2025-11-01"

# 免费计划可用 SQLite 版 Durable Object
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# 可选访问控制：`npx wrangler secret put SIGNALING_TOKEN` 设置后，
# 客户端 hello 必须携带相同 token；未设置时不校验（与 Go 版 -token 一致）
