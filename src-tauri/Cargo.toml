[package]
name = "stardew-valley-assistant"
version = "0.1.5"
description = "Tauri + React desktop assistant for Stardew Valley: mod management, save editor, crop profit calculator and game data tools"
authors = ["ayndpa"]
edition = "2021"

[features]
default = ["devtools"]
devtools = ["tauri/devtools"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stardew_valley_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["native-tls"] }
md5 = "0.7"
tokio = { version = "1", features = ["time", "net", "rt-multi-thread", "macros", "io-util"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
lzxd = "0.2.6"
zip = "2"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.34"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# 运行时注入兜底路径需要直接调用 Win32：远程线程 + LoadLibraryW。
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

# XNB 解包、LZX 解压和 PNG 编码都是热循环，跨 crate 内联能明显受益。
# 不设 panic = "abort"：解析游戏文件时的 panic 需要能被 spawn_blocking 捕获成错误，
# 而不是直接终止整个应用。
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
