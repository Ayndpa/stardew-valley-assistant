[package]
name = "p2p-ice-chat"
version = "0.1.0"
edition = "2021"

[lib]
name = "p2p_ice_chat"
path = "src/lib.rs"

[[bin]]
name = "p2p-ice-chat"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# CLI 专用：stdin/stdout、Ctrl-C、多线程运行时与 env_logger。
# 作为库嵌入（如 desktop-app）时用 default-features = false 关掉。
cli = [
    "dep:env_logger",
    "tokio/rt-multi-thread",
    "tokio/io-std",
    "tokio/io-util",
    "tokio/signal",
]

[dependencies]
anyhow = "1"
env_logger = { version = "0.11", optional = true }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
webrtc-ice = "0.17"
webrtc-util = "0.17"
